name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx oxlint
      - run: npm test
      # Security review 2026-07-28, Finding #4: fails the build on any new
      # production-dependency advisory, regardless of which library it's
      # in -- catches drift instead of relying on someone noticing later.
      - run: npm audit --omit=dev
